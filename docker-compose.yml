# 推荐启动：复制 .env.example 为 .env 后执行 docker compose up -d --build --wait
# 所有宿主机端口均限定在本项目验收端口 19020-19029。
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpwd-local-demo}
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_rag}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-19023}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-rag} -d $${POSTGRES_DB:-enterprise_rag}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.18.2
    restart: unless-stopped
    volumes:
      - qdrantdata:/qdrant/storage
    ports:
      - "${QDRANT_HOST_PORT:-19022}:6333"
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep -q '200 OK'",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7.4.9-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_HOST_PORT:-19024}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s

  backend:
    build: ./backend
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-ragpwd-local-demo}@postgres:5432/${POSTGRES_DB:-enterprise_rag}
      DATABASE_AUTO_CREATE: "false"
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-40}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      VECTOR_BACKEND: ${VECTOR_BACKEND:-qdrant}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:19020,http://localhost:19020}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-60}
      READINESS_TIMEOUT_SECONDS: ${READINESS_TIMEOUT_SECONDS:-2}
      HEALTH_EXTERNAL_CHECKS: ${HEALTH_EXTERNAL_CHECKS:-true}
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-600}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-redis}
      RATE_LIMIT_REDIS_FAILURE_MODE: ${RATE_LIMIT_REDIS_FAILURE_MODE:-fail_closed}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      WORKER_THREAD_TOKENS: ${WORKER_THREAD_TOKENS:-100}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-local-demo-auth-secret-change-before-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      BOOTSTRAP_TENANT_NAME: ${BOOTSTRAP_TENANT_NAME:-Demo Enterprise}
      BOOTSTRAP_TENANT_SLUG: ${BOOTSTRAP_TENANT_SLUG:-demo}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe123!}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-系统管理员}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-fake}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-256}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-echo}
      LLM_MODEL: ${LLM_MODEL:-echo}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      RERANK_ENABLED: ${RERANK_ENABLED:-true}
      RERANK_PROVIDER: ${RERANK_PROVIDER:-lexical}
      RERANK_TOP_N: ${RERANK_TOP_N:-5}
      RAG_MIN_EVIDENCE_SCORE: ${RAG_MIN_EVIDENCE_SCORE:-0.11}
      CHUNK_SIZE: ${CHUNK_SIZE:-800}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-120}
      URL_FETCH_TIMEOUT_SECONDS: ${URL_FETCH_TIMEOUT_SECONDS:-10}
      URL_FETCH_MAX_REDIRECTS: ${URL_FETCH_MAX_REDIRECTS:-3}
      URL_FETCH_MAX_MB: ${URL_FETCH_MAX_MB:-5}
    volumes:
      - ragdata:/app/data
    ports:
      - "${BACKEND_HOST_PORT:-19021}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=4)",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    stop_grace_period: 30s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-19020}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
  qdrantdata:
  redisdata:
  ragdata:
