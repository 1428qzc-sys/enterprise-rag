name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Run tests
        run: python -m pytest

  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

  docker-smoke:
    name: Docker Compose release smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    env:
      COMPOSE_PROJECT_NAME: enterprise-rag-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Start clean production stack
        run: docker compose --env-file .env.example up -d --build --wait

      - name: Verify migrated schema
        run: docker compose --env-file .env.example exec -T backend alembic current

      - name: Run release chain
        run: >-
          docker compose --env-file .env.example exec -T backend
          python scripts/release_smoke.py
          --base-url http://127.0.0.1:8000
          --frontend-url http://frontend

      - name: Run Chromium end-to-end flow
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:19020
        run: npm run e2e

      - name: Run Lighthouse quality gates
        working-directory: frontend
        env:
          LIGHTHOUSE_URL: http://127.0.0.1:19020
        run: npm run lighthouse

      - name: Upload browser quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-quality-evidence
          path: |
            artifacts/lighthouse.json
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Print service logs on failure
        if: failure()
        run: |
          docker compose --env-file .env.example ps
          docker compose --env-file .env.example logs --no-color --tail=300

      - name: Remove test stack and volumes
        if: always()
        run: docker compose --env-file .env.example down -v --remove-orphans
